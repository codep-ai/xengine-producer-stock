version: 2
sources:
  - name: stock_raw
    description: Raw stock tables. Glue-managed Apache Iceberg in the customer's bucket (Glue database stock_iceberg); no engine owns them.
    database: awsdatacatalog
    schema: stock_iceberg
    meta: {engine: athena, physical_format: iceberg}
    tables:
      - name: prices
      - name: exchange_ref
      - name: fx_rates_daily
      - name: ticker_universe
